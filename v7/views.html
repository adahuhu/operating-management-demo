<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>经营管理中台｜分析视图</title>
<link rel="stylesheet" href="./style.css?v=20261013a">
<link rel="stylesheet" href="./views.css?v=20261013a">
<link rel="stylesheet" href="./goals-v7.css?v=20261013a">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="brandmark">经</div><div><strong>经营管理中台</strong><small>经营管理演示</small></div></div>
    <nav class="nav" id="viewNav" aria-label="产品导航"></nav>
    <div class="sidefoot">演示数据 · 2026 年 10 月<br>数据截至 10.18<br>金额单位：万元</div>
  </aside>
  <div class="content">
    <div class="topbar"><span>经营管理中台　/　<b id="routeCrumb">目标制定</b></span><a href="./index.html?v=20261013a">返回经营总控 ↗</a></div>
    <nav class="view-mobile-nav" id="viewMobileNav" aria-label="移动端产品导航"></nav>
    <main id="viewMain" tabindex="-1"></main>
  </div>
</div>
<template id="inventoryMapTemplate"><article class="panel map-panel">
          <div class="panelhead"><h3>货值分布</h3><span>当前货值 510 万 · 按存放环节</span></div>
          <div class="map-frame">
            <svg class="asset-map" viewBox="0 0 1200 470" role="img" aria-label="货值在国内仓、海外仓、平台仓和在途四个环节的分布示意，地点与线路不代表实际仓址">
              <defs><linearGradient id="mapRoute" gradientUnits="userSpaceOnUse" x1="265" y1="145" x2="970" y2="166"><stop stop-color="#63d5fa"/><stop offset=".5" stop-color="#aa94ff"/><stop offset="1" stop-color="#65e2c4"/></linearGradient></defs>
              <image href="./world-map.svg" x="0" y="0" width="1200" height="470"/>
              <path class="map-route-base" d="M970 166 C900 80 755 65 635 110 C510 60 375 75 265 145"/>
              <path class="map-route-motion" d="M970 166 C900 80 755 65 635 110 C510 60 375 75 265 145"/>
              <g class="map-node node-platform" transform="translate(265 145)"><circle class="map-halo" r="21"/><circle class="map-ring" r="9"/><circle class="map-core" r="4"/></g>
              <g class="map-node node-overseas" transform="translate(635 110)"><circle class="map-halo" r="17"/><circle class="map-ring" r="8"/><circle class="map-core" r="3.5"/></g>
              <g class="map-node node-domestic" transform="translate(970 166)"><circle class="map-halo" r="15"/><circle class="map-ring" r="7"/><circle class="map-core" r="3"/></g>
              <g class="map-node node-transit" transform="translate(795 100)"><circle class="map-halo" r="13"/><circle class="map-ring" r="6"/><circle class="map-core" r="2.8"/></g>
              <g class="map-callout platform-callout" transform="translate(128 177)"><rect width="170" height="60" rx="5"/><text x="13" y="24">平台仓</text><text class="map-value" x="13" y="47">230 万 · 45.1%</text></g>
              <g class="map-callout overseas-callout" transform="translate(540 150)"><rect width="170" height="60" rx="5"/><text x="13" y="24">海外仓</text><text class="map-value" x="13" y="47">150 万 · 29.4%</text></g>
              <g class="map-callout domestic-callout" transform="translate(977 213)"><rect width="170" height="60" rx="5"/><text x="13" y="24">国内仓</text><text class="map-value" x="13" y="47">80 万 · 15.7%</text></g>
              <g class="map-callout transit-callout" transform="translate(766 26)"><rect width="164" height="55" rx="5"/><text x="13" y="23">在途</text><text class="map-value" x="13" y="45">50 万 · 9.8%</text></g>
            </svg>
            <div class="map-watermark">GLOBAL INVENTORY / LOCATION VIEW</div>
            <div class="map-scroll-hint">左右滑动查看地图 →</div>
          </div>
          <div class="map-summary">
            <div><span>平台仓</span><b>230 万</b><small>45.1% · 90 天以上 20 万</small></div>
            <div><span>海外仓</span><b>150 万</b><small>29.4% · 90 天以上 32 万</small></div>
            <div><span>国内仓</span><b>80 万</b><small>15.7% · 90 天以上 16 万</small></div>
            <div><span>在途</span><b>50 万</b><small>9.8% · 90 天以上 0 万</small></div>
          </div>
          <p class="panelnote">仓位示意，非实际仓址或运输路线。</p>
        </article></template>
<script src="./views.js?v=20261013a"></script>
<script src="./motion.js?v=20261013a"></script>

</body>
</html>
